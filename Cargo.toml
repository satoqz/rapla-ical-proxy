[package]
name = "rapla-ical-proxy"
edition = "2024"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "http2", "query"] }
chrono = { version = "0.4", default-features = false, features = ["std", "now", "serde"] }
html-escape = "0.3"
icalendar = { version = "0.17", default-features = false, features = ["parser"] }
moka = { version = "0.12", default-features = false, features = ["future"] }
reqwest = { version = "0.13", default-features = false, features = ["charset", "rustls"] }
scraper = { version = "0.29", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["preserve_order"] }
serde_urlencoded = "0.7"
tokio = { version = "1.54", features = ["rt-multi-thread", "signal", "test-util"] }
